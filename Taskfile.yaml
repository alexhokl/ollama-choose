version: '3'

vars:
  BINARY: ollama-choose
  BIN_DIR: bin
  MAIN_PKG: ./cmd/ollama-choose

tasks:
  default:
    desc: List available tasks
    aliases: [list]
    cmds:
      - task --list

  build:
    desc: Compile all packages
    cmds:
      - go build ./...

  binary:
    desc: Build the {{.BINARY}} binary into {{.BIN_DIR}}/
    cmds:
      - go build -o {{.BIN_DIR}}/{{.BINARY}} {{.MAIN_PKG}}
    sources:
      - '**/*.go'
      - go.mod
    generates:
      - '{{.BIN_DIR}}/{{.BINARY}}'

  install:
    desc: Install the CLI to GOBIN
    cmds:
      - go install {{.MAIN_PKG}}

  run:
    desc: Run the CLI (pass args after --, e.g. task run -- noul --model clef ...)
    cmds:
      - go run {{.MAIN_PKG}} {{.CLI_ARGS}}

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  cover:
    desc: Run unit tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all sources in place
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Fail if any source needs formatting
    cmds:
      - test -z "$(gofmt -l .)"

  lint:
    desc: Formatting check and go vet
    cmds:
      - task: fmt-check
      - task: vet

  check:
    desc: "Full suite: fmt-check, vet, build, test"
    cmds:
      - task: fmt-check
      - task: vet
      - task: build
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}